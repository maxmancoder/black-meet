<style>

        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 300ms, transform 300ms; }

<!-- Main Container -->

<!-- Header -->

</div>
<!-- Glass Panel -->
<div class="glass-panel rounded-2xl shadow-2xl p-lg relative overflow-hidden" id="auth-container">
<!-- Login View -->
<div class="space-y-md fade-enter-active" id="view-login-options">
<h2 class="font-headline-lg text-headline-lg text-center mb-md">ورود به سیستم</h2>
<button class="btn-primary flex items-center justify-center gap-2" onclick="switchView('view-login-phone')">
<span class="material-symbols-outlined">phone_iphone</span>
                    ورود با شماره موبایل
                </button>
<button class="btn-secondary flex items-center justify-center gap-2" onclick="switchView('view-login-email')">
<span class="material-symbols-outlined">mail</span>
                    ورود با ایمیل
                </button>
<div class="text-center mt-md">
<button class="text-primary hover:text-primary-fixed transition-colors font-body-sm text-body-sm" onclick="switchView('view-signup')">
                        حساب کاربری ندارید؟ ثبت نام کنید
                    </button>
</div>
</div>
<!-- Login Email View -->
<div class="hidden space-y-md" id="view-login-email">
<div class="flex items-center mb-md">
<button class="text-on-surface-variant hover:text-on-surface transition-colors" onclick="switchView('view-login-options')">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h2 class="font-headline-lg text-headline-lg flex-1 text-center pr-6">ورود با ایمیل</h2>
</div>
<input class="form-input" dir="ltr" placeholder="ایمیل" type="email"/>
<input class="form-input" dir="ltr" placeholder="رمز عبور" type="password"/>

</div>
<!-- Login Phone View -->
<div class="hidden space-y-md" id="view-login-phone">
<div class="flex items-center mb-md">
<button class="text-on-surface-variant hover:text-on-surface transition-colors" onclick="switchView('view-login-options')">

</button>

</div>

<button class="btn-primary" onclick="switchView('view-otp')">ارسال کد تایید</button>
</div>

<div class="flex items-center mb-md">
<button class="text-on-surface-variant hover:text-on-surface transition-colors" onclick="switchView('view-login-options')">

</button>

<input class="form-input" dir="ltr" placeholder="نام کاربری (یکتا)" type="text"/>
<input class="form-input" dir="ltr" placeholder="ایمیل (یکتا)" type="email"/>
<input class="form-input" dir="ltr" placeholder="شماره موبایل (یکتا)" type="tel"/>

<div class="flex items-center mb-md">
<button class="text-on-surface-variant hover:text-on-surface transition-colors" onclick="switchView('view-login-options')">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h2 class="font-headline-lg text-headline-lg flex-1 text-center pr-6">تایید شماره</h2>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center mb-4">کد ارسال شده به شماره خود را وارد کنید</p>

<button class="btn-primary">تایید و ورود</button>
<div class="text-center mt-4">
<p class="font-body-sm text-body-sm text-on-surface-variant" id="timer-text">ارسال مجدد کد تا <span id="countdown">۳۰</span> ثانیه دیگر</p>
</div>
</div>
</div>

<!-- Toast Notification -->
<div class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 z-50" id="toast">
<div class="bg-error-container text-on-error-container px-6 py-3 rounded-lg shadow-xl flex items-center gap-3">
<span class="material-symbols-outlined">error</span>
<span class="font-body-md text-body-md" id="toast-message">پیام خطا</span>
</div>
</div>
<script>
        function switchView(viewId) {
            // Hide all views
            const views = ['view-login-options', 'view-login-email', 'view-login-phone', 'view-signup', 'view-otp'];
            views.forEach(id => {
                const el = document.getElementById(id);
                el.classList.add('hidden');
                el.classList.remove('fade-enter-active');
            });

            // Show target view
            const target = document.getElementById(viewId);
            target.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                target.classList.add('fade-enter-active');
            }, 10);

            if(viewId === 'view-otp') {
                startTimer();
            }
        }

        let timerInterval;
        function startTimer() {
            clearInterval(timerInterval);
            let timeLeft = 30;
            const timerSpan = document.getElementById('countdown');
            const timerText = document.getElementById('timer-text');
            
            // Persian digits map
            const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            const toFarsiNumber = (n) => n.toString().replace(/\d/g, x => farsiDigits[x]);

            timerSpan.innerText = toFarsiNumber(timeLeft);
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerSpan.innerText = toFarsiNumber(timeLeft);
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerText.innerHTML = `<button class="text-primary hover:text-primary-fixed" onclick="startTimer()">ارسال مجدد کد</button>`;
                }
            }, 1000);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.innerText = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
