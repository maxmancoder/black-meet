                        </button>

<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Timer Logic
        let timeLeft = 30;
        const timerElement = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');
        let timerId;

        function startTimer() {
            resendBtn.disabled = true;
            timeLeft = 30;
            timerElement.parentElement.innerHTML = `ارسال مجدد (<span id="timer">${timeLeft}</span>s)`;
            
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = 'ارسال مجدد';
                }
            }, 1000);
        }

        startTimer();

        resendBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!resendBtn.disabled) {
                // mock new code
                document.getElementById('mock-code').textContent = Math.floor(100000 + Math.random() * 900000);
                startTimer();
                // reset inputs
                inputs.forEach(input => input.value = '');
                inputs[0].focus();
            }
        });

        // Form Submit
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            let code = '';
            inputs.forEach(input => code += input.value);
            const mockCode = document.getElementById('mock-code').textContent;
            
            if (code === mockCode) {
                alert('کد تایید شد.');
            } else {
                alert('کد وارد شده اشتباه است.');
                inputs.forEach(input => {
                    input.classList.add('border-error');
                    setTimeout(() => input.classList.remove('border-error'), 1000);
                });
            }
        });
    </script>
