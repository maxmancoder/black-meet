<style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Ambient Element -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-primary-container rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40vw] h-[40vw] bg-tertiary-container rounded-full blur-[120px]"></div>
</div>
<!-- Navigation suppressed for linear/transactional flow -->
<main class="flex-grow flex items-center justify-center p-md sm:p-lg relative z-10">
<div class="glass-panel w-full max-w-lg rounded-xl shadow-[0_32px_64px_rgba(0,0,0,0.4)] overflow-hidden">
<div class="p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="text-center">
<span class="material-symbols-outlined text-display-md text-primary mb-sm" style="font-variation-settings: 'FILL' 1;">video_call</span>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Create Meeting</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Set up a secure space for your team.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault(); window.location.href='#';">
<div class="relative input-glow rounded-lg bg-surface-container-high border border-outline-variant transition-all duration-200 group">
<label class="absolute left-sm top-xs font-label-sm text-label-sm text-on-surface-variant transition-all duration-200 pointer-events-none group-focus-within:-translate-y-[22px] group-focus-within:text-primary group-focus-within:bg-background px-xs rounded" for="meetingTitle">Meeting Title</label>
<input autofocus="" class="w-full bg-transparent border-none text-on-surface font-body-lg pt-[24px] pb-sm px-sm focus:ring-0 placeholder:text-transparent" id="meetingTitle" placeholder="Enter title" required="" type="text"/>
</div>
<!-- Settings (Optional) -->
<div class="flex flex-col gap-sm mt-sm">
<label class="flex items-center gap-sm cursor-pointer p-sm rounded-lg hover:bg-surface-variant/20 transition-colors">
<input checked="" class="rounded text-primary focus:ring-primary bg-surface-container-high border-outline-variant w-4 h-4" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface">Enable Waiting Room</span>
</label>
<label class="flex items-center gap-sm cursor-pointer p-sm rounded-lg hover:bg-surface-variant/20 transition-colors">
<input class="rounded text-primary focus:ring-primary bg-surface-container-high border-outline-variant w-4 h-4" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface">Record Automatically</span>
</label>
</div>
<!-- Actions -->
<div class="mt-lg flex justify-end gap-md items-center">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface px-md py-sm rounded-lg transition-colors" type="button">Cancel</button>
<button class="bg-primary-container text-on-primary-container font-label-md text-label-md px-lg py-sm rounded-lg hover:bg-inverse-primary transition-colors duration-200 flex items-center gap-sm shadow-lg" type="submit">
<span>Continue</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Contextual Footer Image -->
<div class="h-32 w-full relative">
<img class="absolute inset-0 w-full h-full object-cover opacity-30 mix-blend-luminosity" data-alt="A dark, modern meeting room interior viewed through a slightly frosted glass pane. The room is softly illuminated by sleek, high-tech blue LED accent lighting along the walls and a faint warm glow from an unseen screen. The setting conveys a sense of secure, professional privacy and high-end digital communication infrastructure. Deep navy blacks and vibrant primary blue accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDbqd1aettCBfEVf7OwRvsoIjdrqop5Kig6o6tEcLLnwNx_Xmc5k-aqyBKUAZDrKNjdTtT_rcC6qeq42g3qvv1cqoQm1jTwLX2SXvW1clbuGm0-BVrjMWpQ5JhhvcoRgV6fW5vl0Rna5emef6NsTXOSvjVP1QR0Cs7nGeRwghCLoTj-xXMAgwcgML1J7QM8z4Xo2W9uyXLt7RW-dAV6bvqQpsMQJ4p0joEQylx2zGGBeCM1fHLZ-Jm0"/>

</main>
<script>
        // Simple micro-interaction for input label floating
        const input = document.getElementById('meetingTitle');
        const label = input.previousElementSibling;

        function checkInput() {
            if (input.value.trim() !== '') {
                label.classList.add('-translate-y-[22px]', 'text-primary', 'bg-background');
            } else {
                 if(document.activeElement !== input) {
                     label.classList.remove('-translate-y-[22px]', 'text-primary', 'bg-background');
                 }
            }
        }

        input.addEventListener('focus', checkInput);
        input.addEventListener('blur', checkInput);
        input.addEventListener('input', checkInput);
        // Initial check in case of autofill
        setTimeout(checkInput, 100);
    </script>
